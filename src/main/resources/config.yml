# ╔══════════════════════════════════╗
# ║     ScoreboardPlugin Config      ║
# ╚══════════════════════════════════╝

# Title of the scoreboard (max 32 chars)
title: "&6&lMurli Network"

# How often to refresh the scoreboard (in ticks, 20 = 1 second)
update-interval-ticks: 20

# Starting money for new players
starting-money: 100.0

# Symbol shown before money amounts
money-symbol: "$"

# ──────────────────────────────────
# Scoreboard Lines
# ──────────────────────────────────
# Available placeholders:
#   {player}  - player name
#   {money}   - player's money balance
#   {tokens}  - player's MurliTokens
#   {kills}   - player's kills
#   {deaths}  - player's deaths
#   {ping}    - player's ping in ms
#   {players} - online/max players
#   {rank}    - player's rank
# Use & for colors. Use "" for blank lines.
lines:
  - "&7&m------------------"
  - "&ePlayers: &f{players}"
  - "&7&m------------------"
  - "&eMoney: &a{money}"
  - "&eMurliTokens: &6{tokens}"
  - "&7&m------------------"
  - "&eRank: &f{rank}"
  - "&eKills: &a{kills}"
  - "&eDeaths: &c{deaths}"
  - "&ePing: &b{ping}"
  - "&7&m------------------"

# ──────────────────────────────────
# Ranks
# ──────────────────────────────────
# Ranks are checked from top to bottom — first match wins.
# Give players the permission to assign their rank.
# OPs will match the first rank they have permission for.
ranks:
  - permission: "rank.owner"
    display: "&4&lOwner"
  - permission: "rank.admin"
    display: "&c&lAdmin"
  - permission: "rank.mod"
    display: "&9&lMod"
  - permission: "rank.vip"
    display: "&6&lVIP"
  - permission: "rank.member"
    display: "&7Member"

# Shown if no rank matches
default-rank: "&7Member"
